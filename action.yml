name: Contributor Detection
description: Detect high-confidence automated contributors from public GitHub evidence.
author: Open-Source-Bazaar contributors

inputs:
  github-token:
    description: GitHub token with read access, permission to comment or label, and optionally organization Blocking users write permission.
    required: true
  block-high-confidence-automation:
    description: Block high-confidence automated user accounts when the token has organization Blocking users write permission.
    required: false
    default: false
  ai-review:
    description: Use GitHub Models for a second, evidence-grounded review.
    required: false
    default: true
  model:
    description: GitHub Models model identifier.
    required: false
    default: openai/gpt-4.1
  comment:
    description: Create or update the contributor report comment.
    required: false
    default: true
  fail-on-high-risk:
    description: Report a workflow error when the contributor is high risk.
    required: false
    default: false

outputs:
  author:
    description: Contributor login that was inspected.
  risk-level:
    description: low, medium, or high.
  risk-score:
    description: Numeric risk score from 0 to 100.
  report-json:
    description: Machine-readable report.
  blocked:
    description: Whether the contributor was blocked from the organization.

runs:
  using: node24
  main: dist/index.mjs

branding:
  icon: shield
  color: blue
